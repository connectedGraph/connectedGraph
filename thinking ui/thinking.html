<style>
.cc{font-family:"Cascadia Code","JetBrains Mono","SF Mono",Menlo,Consolas,monospace;
  color:#c9d1d9;font-size:14px;line-height:1.55;}
.cc .cc-row{display:inline-flex;align-items:center;gap:8px;}
.cc .cc-spin{color:#22d3ee;font-weight:700;display:inline-flex;align-items:center;justify-content:center;width:1.3em;height:1.55em;line-height:1;flex:0 0 auto;}
.cc .cc-label{white-space:nowrap;}
.cc .cc-accent{color:#22d3ee;}
.cc .cc-dim{color:#6b7a89;}
.cc .cc-bold{font-weight:700;}
.cc .cc-verb{background:linear-gradient(90deg,#22d3ee 0%,#22d3ee 38%,#e3fbff 50%,#22d3ee 62%,#22d3ee 100%);
  background-size:220% 100%;-webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;color:#22d3ee;animation:cc-sweep 2.4s linear infinite;}
@keyframes cc-sweep{0%{background-position:130% 0;}100%{background-position:-30% 0;}}
.cc-inline{color:#22d3ee;font-weight:600;}
</style>
<span class="cc cc-inline cc-row"><span class="cc-spin">✻</span><span class="cc-label"><span class="cc-verb">Pondering</span>…</span></span>
<script>(function(){
  var F=['\u273b','\u273a','\u2739','\u2738','\u2737','\u2736','\u2726','\u2736','\u2737','\u2738','\u2739','\u273a'];
  var V=['Cogitating','Pondering','Contemplating','Deliberating','Architecting','Synthesizing','Orchestrating','Composing','Brewing','Whisking','Caramelizing','Marinating','Seasoning','Crystallizing','Transmuting','Conjuring','Finagling','Vibing'];
  function rnd(a){return a[Math.floor(Math.random()*a.length)];}
  document.querySelectorAll('.cc:not([data-cc])').forEach(function(r){
    r.setAttribute('data-cc','1');
    var sp=r.querySelector('.cc-spin'),vb=r.querySelector('.cc-verb'),sc=r.querySelector('.cc-sec');
    if(sp){var i=0;setInterval(function(){i=(i+1)%F.length;sp.textContent=F[i];},90);}
    if(vb){vb.textContent=rnd(V);setInterval(function(){vb.textContent=rnd(V);},1400);}
    if(sc){var s=0;setInterval(function(){s++;sc.textContent=s;},1000);}
  });
})();</script>
