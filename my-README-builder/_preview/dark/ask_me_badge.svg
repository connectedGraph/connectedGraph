<svg xmlns="http://www.w3.org/2000/svg" width="340" height="52" viewBox="0 0 340 52" fill="none">
  <defs>
    <filter id="badge-shadow" x="-3%" y="-5%" width="106%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <linearGradient id="pill-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6e40c9"/>
      <stop offset="100%" stop-color="#9d7ee8"/>
    </linearGradient>
  </defs>

  <!-- Outer card -->
  <rect x="1" y="1" width="338" height="50" rx="12"
        fill="#1a1b26" stroke="#24283b" stroke-width="1" filter="url(#badge-shadow)"/>

  <!-- Coloured pill / CTA area -->
  <rect x="12" y="10" width="316" height="32" rx="16"
        fill="#1e1a2e" stroke="#9d7ee8" stroke-width="1.5"/>

  <!-- Robot icon -->
  <g transform="translate(22, 16)">
    
    <rect x="2" y="5" width="16" height="11" rx="3" stroke="#bb9af3" stroke-width="1.6" fill="none"/>
    <circle cx="7.5" cy="10.5" r="1.5" fill="#bb9af3"/>
    <circle cx="12.5" cy="10.5" r="1.5" fill="#bb9af3"/>
    <path d="M7.5 13.5 Q10 15 12.5 13.5" stroke="#bb9af3" stroke-width="1.4" stroke-linecap="round" fill="none"/>
    <line x1="10" y1="2" x2="10" y2="5" stroke="#bb9af3" stroke-width="1.6" stroke-linecap="round"/>
    <circle cx="10" cy="1.5" r="1" fill="#bb9af3"/>
    <line x1="0" y1="9" x2="2" y2="9" stroke="#bb9af3" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="18" y1="9" x2="20" y2="9" stroke="#bb9af3" stroke-width="1.4" stroke-linecap="round"/>
  </g>

  <!-- "🤖 Ask Me via Claude" label -->
  <text x="53" y="30"
        font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif"
        font-size="13" font-weight="700" fill="#c0caf5">Ask Me via Claude</text>

  <!-- Separator -->
  <line x1="197" y1="18" x2="197" y2="34" stroke="#9d7ee8" stroke-width="1" stroke-opacity="0.4"/>

  <!-- URL text -->
  <text x="210" y="30"
        font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif"
        font-size="11.5" font-weight="600" fill="#7dcfff">6767.chat/#about</text>

  <!-- Arrow -->
  <text x="313" y="30"
        font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif"
        font-size="13" font-weight="700" fill="#9d7ee8">↗</text>
</svg>