<svg xmlns="http://www.w3.org/2000/svg" width="750" height="110" viewBox="0 0 750 110" fill="none">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="15" y="15" width="720" height="80" rx="12" fill="#f6f8fa" stroke="#d1d5db" stroke-width="1.5" filter="url(#shadow)"/>

  <!-- Icon & Text Group -->
  <g transform="translate(35, 35)">
    
    <rect x="0" y="0" width="40" height="40" rx="10" fill="#e1ecf8"/>
    <g transform="translate(10, 10)" stroke="#0366d6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
      <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
      <path d="M9 7l3 3-3 3"/>
    </g>
    
  </g>

  <!-- Left Text -->
  <text x="90" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="14" font-weight="bold" fill="#24292e">Interactive API Documentation</text>
  <text x="90" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="11" fill="#586069">Explore endpoints, schemas, parameters, and live try-outs</text>

  <!-- Right CTA Button -->
  <g transform="translate(525, 38)">
    <rect x="0" y="0" width="190" height="34" rx="17" fill="#ffffff" stroke="#0366d6" stroke-width="1.5"/>
    <text x="95" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="11.5" font-weight="bold" fill="#0366d6" text-anchor="middle">Explore API Docs ↗</text>
  </g>
</svg>
